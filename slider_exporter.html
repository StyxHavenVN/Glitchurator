<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osu! Authentic Slider Exporter</title>
<style>
  :root {
    --bg-main: #0c0d12;
    --bg-card: #151720;
    --accent: #ff66aa;
    --text: #eef1f8;
    --text-dim: #7f879d;
    --border: #232736;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bg-main); color: var(--text); padding: 18px; display: flex; gap: 18px; height: 100vh; overflow: hidden; }
  
  .sidebar { width: 380px; min-width: 380px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .viewport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #060709; border-radius: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  
  h2 { font-size: 1.15rem; color: var(--accent); }
  p.sub { font-size: 0.78rem; color: var(--text-dim); }
  label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 4px; }
  .form-group { display: flex; flex-direction: column; }
  input[type="file"], select, input[type="number"], input[type="range"], input[type="color"] {
    background: #0f1017; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; width: 100%;
  }
  .row { display: flex; gap: 8px; }
  .row .form-group { flex: 1; }
  
  button.btn {
    background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 6px;
  }
  button.btn:hover { opacity: 0.9; }
  button.btn:disabled { opacity: 0.35; cursor: not-allowed; }
  
  .canvas-container {
    max-width: 95%; max-height: 90%; display: flex; align-items: center; justify-content: center;
    background-image: linear-gradient(45deg, #11131b 25%, transparent 25%), linear-gradient(-45deg, #11131b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #11131b 75%), linear-gradient(-45deg, transparent 75%, #11131b 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    border: 1px dashed var(--border); border-radius: 8px; overflow: hidden;
  }
  canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
  .info-tag { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,0.75); padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; color: var(--text-dim); }
</style>
</head>
<body>

<div class="sidebar">
  <div>
    <h2>osu! Authentic Slider Exporter</h2>
    <p class="sub">Tái tạo 100% Shader gameplay chuẩn xác, nền trong suốt</p>
  </div>

  <div class="form-group">
    <label>1. Chọn Beatmap (.osu)</label>
    <input type="file" id="fileInput" accept=".osu">
  </div>

  <div class="form-group">
    <label>2. Danh sách Slider</label>
    <select id="sliderSelect" disabled>
      <option value="">-- Vui lòng chọn file .osu --</option>
    </select>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Rộng (Width - px)</label>
      <input type="number" id="imgWidth" value="2560" step="128" min="256" max="8192">
    </div>
    <div class="form-group">
      <label>Cao (Height - px)</label>
      <input type="number" id="imgHeight" value="1440" step="128" min="256" max="8192">
    </div>
  </div>

  <div class="form-group">
    <label>Mức độ phóng đại (Zoom Focus: <span id="zoomVal">100%</span>)</label>
    <input type="range" id="zoomLevel" min="20" max="600" value="100">
  </div>

  <div class="row">
    <div class="form-group">
      <label>Dịch chuyển X (Pan)</label>
      <input type="number" id="panX" value="0" step="10">
    </div>
    <div class="form-group">
      <label>Dịch chuyển Y (Pan)</label>
      <input type="number" id="panY" value="0" step="10">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Màu Viền (Border)</label>
      <input type="color" id="borderColor" value="#7884a2">
    </div>
    <div class="form-group">
      <label>Màu Thân (Track Body)</label>
      <input type="color" id="bodyColor" value="#161720">
    </div>
  </div>

  <button class="btn" id="exportBtn" disabled>Tải ảnh PNG (Nền trong suốt)</button>
</div>

<div class="viewport">
  <div class="info-tag" id="infoTag">Chưa tải file</div>
  <div class="canvas-container">
    <canvas id="renderCanvas" width="2560" height="1440"></canvas>
  </div>
</div>

<script>
let beatmap = { cs: 4, sliders: [] };
const fileInput = document.getElementById('fileInput');
const sliderSelect = document.getElementById('sliderSelect');
const exportBtn = document.getElementById('exportBtn');
const canvas = document.getElementById('renderCanvas');
const ctx = canvas.getContext('2d');
const infoTag = document.getElementById('infoTag');
const zoomLevel = document.getElementById('zoomLevel');
const zoomVal = document.getElementById('zoomVal');

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  parseOsu(await file.text());
});

sliderSelect.addEventListener('change', () => {
  if (sliderSelect.value !== '') renderSlider(beatmap.sliders[sliderSelect.value]);
});

zoomLevel.addEventListener('input', () => {
  zoomVal.innerText = `${zoomLevel.value}%`;
  if (sliderSelect.value !== '') renderSlider(beatmap.sliders[sliderSelect.value]);
});

['imgWidth', 'imgHeight', 'panX', 'panY', 'borderColor', 'bodyColor'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (sliderSelect.value !== '') renderSlider(beatmap.sliders[sliderSelect.value]);
  });
});

exportBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `osu_slider_${parseInt(sliderSelect.value) + 1}_authentic.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function parseOsu(content) {
  const lines = content.split(/\r?\n/);
  beatmap.sliders = [];
  let section = '';
  
  for (let line of lines) {
    line = line.trim();
    if (line.startsWith('[') && line.endsWith(']')) {
      section = line.slice(1, -1);
      continue;
    }
    if (!line || line.startsWith('//')) continue;

    if (section === 'Difficulty') {
      const [k, v] = line.split(':').map(s => s.trim());
      if (k === 'CircleSize') beatmap.cs = parseFloat(v);
    } else if (section === 'HitObjects') {
      const p = line.split(',');
      const type = parseInt(p[3]);
      if (type & 2) {
        const time = parseInt(p[2]);
        const curveData = p[5].split('|');
        const curveType = curveData[0];
        const rawPoints = [{ x: parseFloat(p[0]), y: parseFloat(p[1]) }];
        for (let i = 1; i < curveData.length; i++) {
          const [px, py] = curveData[i].split(':').map(Number);
          rawPoints.push({ x: px, y: py });
        }
        const length = parseFloat(p[7]);
        beatmap.sliders.push({ time, curveType, rawPoints, length });
      }
    }
  }

  sliderSelect.innerHTML = beatmap.sliders.map((s, i) => {
    const min = Math.floor(s.time / 60000);
    const sec = Math.floor((s.time % 60000) / 1000);
    const ms = s.time % 1000;
    const timeStr = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}:${String(ms).padStart(3, '0')}`;
    return `<option value="${i}">#${i + 1} [${timeStr}] - Dạng ${s.curveType} (Dài: ${Math.round(s.length)}px)</option>`;
  }).join('');

  sliderSelect.disabled = false;
  exportBtn.disabled = false;
  renderSlider(beatmap.sliders[0]);
}

function getRadius(cs) {
  return 54.4 - 4.48 * cs;
}

function hexToRgb(hex) {
  const c = parseInt(hex.slice(1), 16);
  return { r: (c >> 16) & 255, g: (c >> 8) & 255, b: c & 255 };
}

// Render Slider liền khối - Tuyệt đối không vẽ đè vòng tròn vào điểm neo
function renderSlider(slider) {
  const w = parseInt(document.getElementById('imgWidth').value) || 2560;
  const h = parseInt(document.getElementById('imgHeight').value) || 1440;
  const borderHex = document.getElementById('borderColor').value;
  const bodyHex = document.getElementById('bodyColor').value;
  const zoomPct = (parseInt(document.getElementById('zoomLevel').value) || 100) / 100;
  const panX = parseInt(document.getElementById('panX').value) || 0;
  const panY = parseInt(document.getElementById('panY').value) || 0;

  canvas.width = w;
  canvas.height = h;
  ctx.clearRect(0, 0, w, h);

  const radius = getRadius(beatmap.cs);
  const pathPoints = generatePath(slider.curveType, slider.rawPoints, slider.length);
  if (pathPoints.length < 2) return;

  // Tính Bounding Box chuẩn xác để lấy tâm hình học
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let pt of pathPoints) {
    if (pt.x < minX) minX = pt.x;
    if (pt.x > maxX) maxX = pt.x;
    if (pt.y < minY) minY = pt.y;
    if (pt.y > maxY) maxY = pt.y;
  }

  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;
  const boundW = (maxX - minX) + radius * 2;
  const boundH = (maxY - minY) + radius * 2;

  // Tỉ lệ cơ sở (Fit to canvas với lề 10%)
  const baseScale = Math.min((w * 0.8) / boundW, (h * 0.8) / boundH);
  const finalScale = baseScale * zoomPct;

  ctx.save();
  // Đưa tâm hình học của slider về chính xác trung tâm ảnh
  ctx.translate(w / 2 + panX, h / 2 + panY);
  ctx.scale(finalScale, finalScale);
  ctx.translate(-centerX, -centerY);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const b = hexToRgb(borderHex);
  const m = hexToRgb(bodyHex);

  // Shader quét đa tầng chuẩn OpenGL của osu! (12 Passes mượt mà)
  // Viền ngoài -> Rãnh đổ bóng -> Mép thân sáng -> Chuyển sắc tâm tối
  const passes = [
    // 1. Viền ngoài chống răng cưa (Outer dark contour)
    { rFactor: 1.00, color: `rgba(${b.r * 0.35}, ${b.g * 0.35}, ${b.b * 0.35}, 0.85)` },
    // 2. Viền kim loại chính (Metallic highlight)
    { rFactor: 0.98, color: `rgba(${b.r}, ${b.g}, ${b.b}, 1.0)` },
    // 3. Đổ bóng mép trong viền (Inner groove shadow)
    { rFactor: 0.87, color: `rgba(${Math.max(0, m.r * 0.3)}, ${Math.max(0, m.g * 0.3)}, ${Math.max(0, m.b * 0.3)}, 1.0)` },
    // 4. Thân slider mép ngoài (Track body outer edge)
    { rFactor: 0.82, color: `rgba(${Math.min(255, m.r * 1.5)}, ${Math.min(255, m.g * 1.5)}, ${Math.min(255, m.b * 1.5)}, 1.0)` },
    // 5-9. Thân slider chuyển sắc êm dịu (Smooth body cylindrical falloff)
    { rFactor: 0.72, color: `rgba(${Math.min(255, m.r * 1.3)}, ${Math.min(255, m.g * 1.3)}, ${Math.min(255, m.b * 1.3)}, 1.0)` },
    { rFactor: 0.60, color: `rgba(${m.r}, ${m.g}, ${m.b}, 1.0)` },
    { rFactor: 0.46, color: `rgba(${m.r * 0.85}, ${m.g * 0.85}, ${m.b * 0.85}, 1.0)` },
    { rFactor: 0.32, color: `rgba(${m.r * 0.7}, ${m.g * 0.7}, ${m.b * 0.7}, 1.0)` },
    // 10. Lòng máng tâm tối (Deep core center)
    { rFactor: 0.18, color: `rgba(${m.r * 0.55}, ${m.g * 0.55}, ${m.b * 0.55}, 1.0)` }
  ];

  for (let pass of passes) {
    ctx.beginPath();
    ctx.lineWidth = radius * 2 * pass.rFactor;
    ctx.strokeStyle = pass.color;
    drawContinuousPath(ctx, pathPoints);
    ctx.stroke();
  }

  ctx.restore();
  infoTag.innerHTML = `Độ phân giải: ${w}x${h} | Zoom: ${(finalScale * 100).toFixed(0)}% | CS: ${beatmap.cs}`;
}

function drawContinuousPath(context, pts) {
  context.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    context.lineTo(pts[i].x, pts[i].y);
  }
}

// Nội suy đường đi với mật độ điểm dày đặc (High Density Sampling)
function generatePath(type, points, expectedLength) {
  let sampled = [];
  if (type === 'L' || points.length === 2) {
    sampled = sampleLinear(points);
  } else if (type === 'P' && points.length === 3) {
    sampled = sampleCircumcircle(points) || sampleBezier(points);
  } else {
    sampled = sampleBezier(points);
  }

  // Cắt gọt chính xác chiều dài pixelLength
  let total = 0;
  let clamped = [sampled[0]];
  for (let i = 1; i < sampled.length; i++) {
    const d = Math.hypot(sampled[i].x - sampled[i-1].x, sampled[i].y - sampled[i-1].y);
    if (total + d >= expectedLength) {
      const rem = expectedLength - total;
      const ratio = d === 0 ? 0 : rem / d;
      clamped.push({
        x: sampled[i-1].x + (sampled[i].x - sampled[i-1].x) * ratio,
        y: sampled[i-1].y + (sampled[i].y - sampled[i-1].y) * ratio
      });
      break;
    }
    total += d;
    clamped.push(sampled[i]);
  }
  return clamped;
}

function sampleLinear(pts) {
  const res = [];
  const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
  const steps = Math.max(10, Math.ceil(dist));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    res.push({
      x: pts[0].x + (pts[1].x - pts[0].x) * t,
      y: pts[0].y + (pts[1].y - pts[0].y) * t
    });
  }
  return res;
}

function sampleBezier(points) {
  let segments = [], curr = [];
  for (let i = 0; i < points.length; i++) {
    curr.push(points[i]);
    if (i < points.length - 1 && points[i].x === points[i+1].x && points[i].y === points[i+1].y) {
      segments.push(curr);
      curr = [];
    }
  }
  if (curr.length) segments.push(curr);

  let full = [];
  for (let seg of segments) {
    // Mật độ cao: 100 bước trên mỗi đoạn cong để viền mượt tuyệt đối
    const steps = Math.max(80, seg.length * 50);
    for (let i = 0; i <= steps; i++) {
      full.push(deCasteljau(seg, i / steps));
    }
  }
  return full;
}

function deCasteljau(pts, t) {
  let cur = pts.map(p => ({ ...p }));
  while (cur.length > 1) {
    let next = [];
    for (let i = 0; i < cur.length - 1; i++) {
      next.push({
        x: (1 - t) * cur[i].x + t * cur[i+1].x,
        y: (1 - t) * cur[i].y + t * cur[i+1].y
      });
    }
    cur = next;
  }
  return cur[0];
}

function sampleCircumcircle(pts) {
  const [a, b, c] = pts;
  const d = 2 * (a.x * (b.y - c.y) + b.x * (c.y - a.y) + c.x * (a.y - b.y));
  if (Math.abs(d) < 0.001) return null;

  const aSq = a.x * a.x + a.y * a.y, bSq = b.x * b.x + b.y * b.y, cSq = c.x * c.x + c.y * c.y;
  const ux = (aSq * (b.y - c.y) + bSq * (c.y - a.y) + cSq * (a.y - b.y)) / d;
  const uy = (aSq * (c.x - b.x) + bSq * (a.x - c.x) + cSq * (b.x - a.x)) / d;
  const r = Math.hypot(a.x - ux, a.y - uy);

  const startAng = Math.atan2(a.y - uy, a.x - ux);
  const midAng = Math.atan2(b.y - uy, b.x - ux);
  const endAng = Math.atan2(c.y - uy, c.x - ux);

  let sweep = endAng - startAng;
  let dMid = midAng - startAng;
  while (sweep < 0) sweep += Math.PI * 2;
  while (dMid < 0) dMid += Math.PI * 2;
  if (dMid > sweep) sweep -= Math.PI * 2;

  const arcLen = Math.abs(sweep) * r;
  const steps = Math.max(120, Math.ceil(arcLen * 1.5));
  let res = [];
  for (let i = 0; i <= steps; i++) {
    const ang = startAng + sweep * (i / steps);
    res.push({ x: ux + r * Math.cos(ang), y: uy + r * Math.sin(ang) });
  }
  return res;
}
</script>
</body>
</html>
